<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>小程序标签测试</title>
<script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<style>
body{font-family:sans-serif;padding:20px;background:#f5f5f5}
.card{background:#fff;border-radius:12px;padding:20px;max-width:400px;margin:20px auto}
h3{color:#333;margin:0 0 10px}
.info{font-size:13px;color:#999;margin-bottom:16px}
.btn{display:block;width:100%;height:48px;line-height:48px;text-align:center;background:#FF6B35;color:#fff;border-radius:24px;font-size:16px;font-weight:600;border:0;cursor:pointer;position:relative}
.status{margin-top:16px;padding:12px;background:#f0f0f0;border-radius:8px;font-size:13px;color:#666;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <h3>🧪 小程序标签测试</h3>
  <div class="info" id="info">正在加载...</div>

  <!-- wx-open-launch-weapp 直接放在 HTML 中 -->
  <wx-open-launch-weapp
    id="test-tag"
    appid="wx095b91409f8ecbfe"
    path="pages/channels/live?finderUserName=sphaxIEW2Etr8EL"
    style="display:block;width:100%"
  >
    <script type="text/wxtag-template">
      <style>.btn{display:block;width:100%;height:48px;line-height:48px;text-align:center;background:#07C160;color:#fff;border-radius:24px;font-size:16px;font-weight:600}</style>
      <button class="btn">📺 打开金厨美家小程序</button>
    </script>
  </wx-open-launch-weapp>

  <div class="status" id="log">等待操作...</div>
</div>

<script>
var log = document.getElementById('log')
var info = document.getElementById('info')

function addLog(msg) { log.innerHTML += '<br>' + new Date().toLocaleTimeString() + ' ' + msg }

addLog('UA: ' + (/micromessenger/i.test(navigator.userAgent) ? '✅ 微信浏览器' : '❌ 非微信'))
addLog('supports openTag: ' + (typeof wx !== 'undefined' && typeof wx.config === 'function' ? '✅' : '❌'))

// 获取签名
var corpId = (new URLSearchParams(location.search)).get('corpId') || '4'
fetch('/api/public-account/config?corpId=' + corpId)
  .then(function(r){ return r.json() })
  .then(function(d){
    if (!d.ok || !d.data) { addLog('❌ 签名获取失败: ' + JSON.stringify(d)); return }
    var s = d.data
    addLog('✅ 签名获取成功 appId=' + s.appId)

    wx.config({
      debug: true,
      appId: s.appId,
      timestamp: s.timestamp,
      nonceStr: s.nonceStr,
      signature: s.signature,
      jsApiList: [],
      openTagList: ['wx-open-launch-weapp']
    })

    wx.ready(function(){
      addLog('✅ wx.ready')
      info.innerHTML = '✅ 标签已初始化，请点击上方绿色按钮'
    })

    wx.error(function(err){
      addLog('❌ wx.error: ' + JSON.stringify(err))
      info.innerHTML = '❌ 微信 JSSDK 初始化失败'
    })
  })
  .catch(function(e){
    addLog('❌ 网络错误: ' + e.message)
  })
</script>
</body>
</html>
