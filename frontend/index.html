<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- WeChat WebView ignores HTTP cache headers, meta pragma is more reliable -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- ═══ 微信 WebView 视频播放优化 ═══ -->
    <!-- X5 内核（Android 微信）：指定使用 H5 同层播放器，避免跳转到独立的全屏播放器 -->
    <meta name="x5-video-player-type" content="h5" />
    <meta name="x5-video-player-fullscreen" content="true" />
    <meta name="x5-video-orientation" content="portrait" />
    <title>金地燃气</title>
    <!-- ═══ 微信浏览器：隐藏 uni-app 内置导航栏，避免与微信原生标题栏形成双层标题 ═══ -->
    <!-- 使用 document.write 同步注入 CSS，确保在 uni-app 渲染前生效，无闪烁 -->
    <script>
      if (/micromessenger/i.test(navigator.userAgent)) {
        document.write('<style>uni-page-head{display:none!important}uni-page-head~.uni-placeholder{display:none!important}<\/style>');
      }
    </script>
    <!-- ═══ 微信 JSSDK — CDN 优先(async), 本地兜底（微信 WebView 预缓存 res.wx.qq.com） ═══ -->
    <script async src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js" onerror="var s=document.createElement('script');s.src='./jweixin-1.6.0.js';document.head.appendChild(s)"></script>
    <script>
      // CDN fallback: if wx not available within 2s, load local copy
      (function() {
        if (typeof wx !== 'undefined') return;
        var t = setInterval(function() {
          if (typeof wx !== 'undefined') { clearInterval(t); return; }
        }, 100);
        setTimeout(function() {
          if (typeof wx === 'undefined') {
            console.warn('[JSSDK] CDN not loaded, falling back to local jweixin');
            var s = document.createElement('script');
            s.src = './jweixin-1.6.0.js';
            document.head.appendChild(s);
          }
          clearInterval(t);
        }, 2000);
      })();
    </script>
    <script>
      // ═══ 微信 JSSDK 初始化 — 等待 wx 可用后注入签名 ═══
      // 核心修复：不再立即调用 initWx()，而是监听 WeixinJSBridgeReady 事件，
      // 确保微信 WebView 环境就绪后再 fetch 签名并执行 wx.config()。
      (function() {
        if (!/micromessenger/i.test(navigator.userAgent)) return;
        var url = location.href.split('#')[0];
        var corpId = (new URLSearchParams(location.search)).get('corpId') || '4';
        var sigData = null;       // 缓存签名结果，避免重复 fetch
        var configured = false;

        // ── 获取 JSSDK 签名 ──
        function fetchSignature(callback) {
          if (sigData) return callback(sigData);
          console.log('[JSSDK] fetchSignature, corpId=' + corpId);
          fetch('/api/public-account/js-config?url=' + encodeURIComponent(url) + '&corpId=' + corpId)
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (!d.ok || !d.data) {
                console.error('[JSSDK] 签名接口返回失败:', d.msg);
                // 5s 后重试一次（可能是 access_token 未就绪）
                setTimeout(function() { fetchSignature(callback); }, 5000);
                return;
              }
              sigData = d.data;
              console.log('[JSSDK] 签名成功, appId:', sigData.appId);
              callback(sigData);
            })
            .catch(function(e) {
              console.error('[JSSDK] 获取签名网络失败:', e);
              // 网络恢复后重试
              setTimeout(function() { fetchSignature(callback); }, 3000);
            });
        }

        // ── 执行 wx.config ──
        function doWxConfig(s) {
          if (configured) return;
          configured = true;
          if (typeof wx === 'undefined' || typeof wx.config !== 'function') {
            console.error('[JSSDK] wx.config not a function — jweixin SDK may not have loaded');
            return;
          }
          var jsApiList = [
            'updateAppMessageShareData','updateTimelineShareData',
            'onMenuShareTimeline','onMenuShareAppMessage',
            'chooseImage','previewImage',
            'startRecord','stopRecord','uploadVoice','downloadVoice','translateVoice'
          ];
          // 微信授权获取手机号（注册页使用）
          jsApiList.push('getPhoneNumber');
          // 仅当需要跳转小程序时申请 miniProgram
          if (typeof wx.miniProgram !== 'undefined' || navigator.userAgent.indexOf('miniProgram') > -1) {
            jsApiList.push('miniProgram');
          }
          wx.config({
            debug: (location.search.indexOf('wxdebug=1') !== -1),
            appId: s.appId,
            timestamp: s.timestamp,
            nonceStr: s.nonceStr,
            signature: s.signature,
            jsApiList: jsApiList
          });

          wx.ready(function() {
            console.log('[JSSDK] ✅ wx.ready');
            // 同步 document.title，确保微信原生标题栏显示正确标题
            document.title = '金地燃气';
          });

          wx.error(function(res) {
            console.error('[JSSDK] ❌ wx.error:', res.errMsg || res);
            // 常见错误：invalid signature → 可能是 url 参数不对（应去除 # 后部分）
            // config:fail → 签名时间戳过期或 appId 不匹配
            if (res.errMsg && res.errMsg.indexOf('invalid signature') > -1) {
              console.warn('[JSSDK] 签名无效，正在重试... url=' + url);
              sigData = null;
              configured = false;
              setTimeout(function() { fetchSignature(doWxConfig); }, 1000);
            }
          });
        }

        // ── 启动流程：优先等 WeixinJSBridgeReady，兜底轮询 wx 就绪 ──
        function startJssdk() {
          fetchSignature(function(s) {
            // 一旦签名就绪，若 wx 已可用立刻 config；否则轮询最多 10s
            if (typeof wx !== 'undefined' && typeof wx.config === 'function') {
              doWxConfig(s);
              return;
            }
            var retries = 0;
            var maxRetries = 100; // 100 × 100ms = 10s
            var timer = setInterval(function() {
              retries++;
              if (typeof wx !== 'undefined' && typeof wx.config === 'function') {
                clearInterval(timer);
                doWxConfig(s);
              } else if (retries >= maxRetries) {
                clearInterval(timer);
                console.error('[JSSDK] wx 未就绪（10s 超时），放弃。请检查 jweixin-1.6.0.js 是否加载成功');
              }
            }, 100);
          });
        }

        // WeixinJSBridgeReady 是微信官方推荐的初始化时机
        if (typeof WeixinJSBridge === 'object' && typeof WeixinJSBridge.invoke === 'function') {
          startJssdk();
        } else {
          document.addEventListener('WeixinJSBridgeReady', startJssdk, false);
          // 兜底：5s 后若事件未触发，直接启动
          setTimeout(function() {
            if (!configured && !sigData) {
              console.warn('[JSSDK] WeixinJSBridgeReady 未触发，兜底启动');
              startJssdk();
            }
          }, 5000);
        }
      })();
    </script>
    <script>
      (function() {
        if (typeof WeixinJSBridge === 'object' && typeof WeixinJSBridge.invoke === 'function') {
          handleFontSize();
        } else {
          document.addEventListener('WeixinJSBridgeReady', handleFontSize, false);
          document.addEventListener('DOMContentLoaded', handleFontSize, false);
        }
        function handleFontSize() {
          document.documentElement.style.fontSize = document.documentElement.clientWidth / 20 + 'px';
          setTimeout(function() {
            document.documentElement.style.fontSize = document.documentElement.clientWidth / 20 + 'px';
          }, 1000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
