<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- WeChat WebView ignores HTTP cache headers, meta pragma is more reliable -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>金地燃气聚合展示引流平台</title>
    <!-- ═══ 微信 JSSDK — 加载官方 jweixin SDK ═══ -->
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script>
      // ═══ 微信 JSSDK 初始化 — 双通道：wx.config() + WeixinJSBridge 兜底 ═══
      (function() {
        if (!/micromessenger/i.test(navigator.userAgent)) return;
        var url = location.href.split('#')[0];
        var corpId = (new URLSearchParams(location.search)).get('corpId') || '4';

        function initWx() {
          console.log('[JSSDK] 获取签名, corpId=' + corpId);
          fetch('/api/public-account/js-config?url=' + encodeURIComponent(url) + '&corpId=' + corpId)
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (!d.ok || !d.data) return console.error('[JSSDK] 签名失败:', d.msg);
              var s = d.data;
              console.log('[JSSDK] 签名成功, appId:', s.appId);

              // ═══ 主通道: wx.config() — 需要 jweixin SDK 已加载 ═══
              function doWxConfig(retry) {
                var n = retry || 0
                if (typeof wx !== 'undefined' && typeof wx.config === 'function') {
                  wx.config({
                    debug: s.debug || false,
                    appId: s.appId,
                    timestamp: s.timestamp,
                    nonceStr: s.nonceStr,
                    signature: s.signature,
                    jsApiList: [
                      'updateAppMessageShareData','updateTimelineShareData',
                      'onMenuShareTimeline','onMenuShareAppMessage',
                      'getLocation','openLocation','chooseImage','previewImage',
                      'miniProgram','openChannelsLive'
                    ],
                    openTagList: ['wx-open-launch-weapp']
                  })
                  wx.ready(function() {
                    console.log('[JSSDK] ✅ wx.ready (openChannelsLive available)');
                  })
                  wx.error(function(res) {
                    console.error('[JSSDK] ❌ wx.error:', res.errMsg || res);
                  })
                } else if (n < 50) {
                  setTimeout(function(){ doWxConfig(n+1) }, 100)
                } else {
                  console.error('[JSSDK] wx.config not available after 5s, giving up')
                }
              }
              doWxConfig(0)

              // ═══ 兜底通道: WeixinJSBridge — 用于分享等老 API ═══
              if (typeof WeixinJSBridge !== 'undefined' && typeof WeixinJSBridge.invoke === 'function') {
                WeixinJSBridge.invoke('preVerifyJSAPI', {
                  appId: s.appId, verifyAppId: s.appId,
                  verifySignType: 'sha1',
                  verifyTimestamp: String(s.timestamp),
                  verifyNonceStr: s.nonceStr,
                  verifySignature: s.signature,
                  verifyJsApiList: [
                    'updateAppMessageShareData','updateTimelineShareData',
                    'onMenuShareTimeline','onMenuShareAppMessage',
                    'getLocation','openLocation','chooseImage','previewImage',
                    'miniProgram','openChannelsLive'
                  ],
                  verifyOpenTagList: ['wx-open-launch-weapp']
                }, function(res) {
                  var err = res.err_msg || res.errMsg || ''
                  if (err.indexOf(':ok') !== -1)
                    console.log('[JSSDK] ✅ WeixinJSBridge ready')
                  else
                    console.error('[JSSDK] ❌ WeixinJSBridge:', err)
                })
                WeixinJSBridge.on('menu:share:timeline', function() {})
                WeixinJSBridge.on('menu:share:appmessage', function() {})
              }
            })
            .catch(function(e) { console.error('[JSSDK] 获取签名失败:', e); })
        }
        initWx()
      })();
    </script>
    <script>
      (function() {
        if (typeof WeixinJSBridge === 'object' && typeof WeixinJSBridge.invoke === 'function') {
          handleFontSize();
        } else {
          document.addEventListener('WeixinJSBridgeReady', handleFontSize, false);
          document.addEventListener('DOMContentLoaded', handleFontSize, false);
        }
        function handleFontSize() {
          document.documentElement.style.fontSize = document.documentElement.clientWidth / 20 + 'px';
          setTimeout(function() {
            document.documentElement.style.fontSize = document.documentElement.clientWidth / 20 + 'px';
          }, 1000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
