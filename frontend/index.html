<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>金地燃气聚合展示引流平台</title>
    <!-- 微信 JS-SDK（同步加载，在所有脚本之前） -->
    <script src="/subsystem/ops/jweixin-1.6.0.js"></script>
    <script>
      // ═══ 微信 JSSDK 初始化 ═══
      (function() {
        if (!/micromessenger/i.test(navigator.userAgent)) return;
        var url = location.href.split('#')[0];
        var corpId = (new URLSearchParams(location.search)).get('corpId') || '4';

        var wxConfig, wxReady, wxError;
        var retry = 0;

        function captureWx() {
          if (typeof wx !== 'undefined' && typeof wx.config === 'function') {
            // 抓住引用！后续模块覆盖 wx 也不影响
            wxConfig = wx.config;
            wxReady  = wx.ready;
            wxError  = wx.error;
            return true;
          }
          return false;
        }

        function tryConfig() {
          if (!captureWx()) {
            if (++retry > 30) return console.error('[JSSDK] 超时：wx.config 始终不可用');
            console.log('[JSSDK] 等待 wx 就绪... (' + retry + ')');
            return setTimeout(tryConfig, 200);
          }

          console.log('[JSSDK] wx 引用已捕获，获取签名...');
          fetch('/api/public-account/js-config?url=' + encodeURIComponent(url) + '&corpId=' + corpId)
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (!d.ok || !d.data) return console.error('[JSSDK] 签名失败:', d.msg);
              var s = d.data;
              console.log('[JSSDK] 签名成功, appId:', s.appId);

              // 使用捕获的引用，不依赖全局 wx
              wxReady(function() { console.log('[JSSDK] ✅ ready'); });
              wxError(function(e) { console.error('[JSSDK] ❌', JSON.stringify(e)); });
              wxConfig.call(wx, {
                debug: false, appId: s.appId, timestamp: s.timestamp,
                nonceStr: s.nonceStr, signature: s.signature,
                jsApiList: ['updateAppMessageShareData','updateTimelineShareData','getLocation','openLocation','chooseImage','previewImage','miniProgram'],
                openTagList: ['wx-open-launch-weapp']
              });
            })
            .catch(function(e) { console.error('[JSSDK] 获取签名失败:', e); });
        }

        document.addEventListener('WeixinJSBridgeReady', function() {
          console.log('[JSSDK] WeixinJSBridgeReady 触发');
          retry = 0; tryConfig();
        }, false);
        tryConfig();
      })();
    </script>
    <script>
      (function() {
        if (typeof WeixinJSBridge === 'object' && typeof WeixinJSBridge.invoke === 'function') {
          handleFontSize();
        } else {
          document.addEventListener('WeixinJSBridgeReady', handleFontSize, false);
          document.addEventListener('DOMContentLoaded', handleFontSize, false);
        }
        function handleFontSize() {
          document.documentElement.style.fontSize = document.documentElement.clientWidth / 20 + 'px';
          setTimeout(function() {
            document.documentElement.style.fontSize = document.documentElement.clientWidth / 20 + 'px';
          }, 1000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
