server:
  port: 8084

spring:
  application:
    name: ops-platform
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://104.238.165.57:3306/mall_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: root
    password: aB740602
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
      minimum-idle: 2
      connection-test-query: SELECT 1
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

app:
  resource:
    # 静态资源对外域名（用于拼接完整图片 URL）
    base-url: https://a.15891589.xyz
  upload:
    # 文件上传根目录（绝对路径，确保 Nginx 可读）
    # Nginx location /uploads/ops/ → alias 指向此目录下的 ops/
    base-dir: /home/jason/ops-platform-project/uploads

platform:
  base-url: http://104.238.165.57:8080
  subsystem-code: ops-platform
  jwt-secret: aip-jwt-secret-key-2024-must-be-at-least-32-bytes-long!
  jwt-expiration: 43200
  internal-token: aip-internal-svc-token-2026
  merchant-role-name: 销售商
  sdk-permit-paths:
    - /actuator/**
    - /api/public-account/**
    - /api/ops/auth/**
    - /api/ops/product/**
    - /api/ops/activity/**

# 活动预约提醒配置
ops:
  remind:
    hours-before: 24,1

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.aip.ops: DEBUG
