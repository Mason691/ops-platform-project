server:
  port: 8084
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ops-platform
  # 平台开启 Redis 时，子系统同步检查 blacklist:{jti}；默认关闭不改变现网行为
  redis:
    enabled: ${SPRING_REDIS_ENABLED:false}
  servlet:
    multipart:
      max-file-size: 50MB
      # 验收短视频上限 50MB；multipart 边界/表单开销需额外预留
      max-request-size: 60MB
  datasource:
    url: jdbc:mysql://104.238.165.57:3306/mall_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: root
    password: aB740602
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
      minimum-idle: 2
      connection-test-query: SELECT 1
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  kafka:
    enabled: true
    bootstrap-servers: 113.250.60.41:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: ai-platform-group
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin123.";

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

app:
  resource:
    # 静态资源对外域名（用于拼接完整图片 URL）
    base-url: https://boss.jdzn99.com
  upload:
    # 文件上传根目录（Docker 容器内路径，通过 volume 挂载宿主机目录）
    # Nginx location /uploads/ops/ → proxy_pass → ops-backend
    base-dir: /app/uploads
  receipt-ocr:
    # 红蓝数字同时识别且不一致时的默认采用颜色：RED / BLUE
    # 生产可用环境变量 RECEIPT_OCR_PREFERRED_COLOR 覆盖，无需改代码
    preferred-color: ${RECEIPT_OCR_PREFERRED_COLOR:RED}
  import:
    # 异步导入文件暂存目录。必须使用持久化路径，禁止使用 /tmp/。
    # 非 Docker 环境默认: ${user.home}/data/imports（由 @Value SpEL 求值）
    # Docker 部署时通过环境变量覆盖: APP_IMPORT_UPLOAD_DIR=/app/uploads/imports
    # upload-dir: /app/uploads/imports

platform:
  base-url: http://104.238.165.57:8080
  subsystem-code: ops-platform
  jwt-secret: aip-jwt-secret-key-2024-must-be-at-least-32-bytes-long!
  jwt-expiration: 43200
  internal-token: aip-internal-svc-token-2026
  merchant-role-name: 销售商
  sdk-permit-paths:
    - /actuator/**
    - /uploads/**
    - /api/public-account/**
    - /api/ops/auth/**
    - /api/ops/product/**
    - /api/ops/activity/**

# 物资领用/核销工作流（定义在底座工作流管理端维护；callback 指向本服务 8082）
material:
  requisition:
    definition-code: ${MATERIAL_REQUISITION_DEFINITION:OPS_MATERIAL_REQUISITION_APPROVAL}
    business-type: OPS_MATERIAL_REQUISITION
  write-off:
    definition-code: ${MATERIAL_WRITE_OFF_DEFINITION:OPS_MATERIAL_WRITE_OFF_APPROVAL}
    business-type: OPS_MATERIAL_WRITE_OFF

# mall-service 地址（用于跨子系统调用 InternalProductController）
mall-service:
  base-url: http://localhost:8083

# 供应链基础资料服务（员工手工录入的品牌/品类/型号下拉 + 保存校验）
# 生产与 scm-backend 同 host 网络，默认 8084；本地联调可覆盖 SCM_SERVICE_BASE_URL
scm-service:
  base-url: http://localhost:8084

# 微信公众号网页授权（员工微信登录）
# redirect-uri 必须与公众号后台「网页授权域名」下的实际回调地址完全一致；
# 生产 H5 base 为 /ops/，微信会在该地址后追加 ?code=...&state=...
wechat:
  oauth:
    redirect-uri: ${WECHAT_OAUTH_REDIRECT_URI:https://boss.jdzn99.com/ops/}
    state-ttl-seconds: 300
    scope: snsapi_base

# 活动预约提醒配置
ops:
  remind:
    hours-before: 24,1
# 作战地图 ETL（单实例部署）：启动全量初始化 + 定时增量刷新
battle-map:
  etl:
    auto-refresh: true
    init-on-startup: true
    cron: "0 */30 * * * *"

# 外部燃气平台数据源（jinyuan_info）
gas:
  datasource:
    jdbc-url: jdbc:mysql://parking-db.mysql.polardb.rds.aliyuncs.com:3306/jinyuan_info?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: jinyuan_kaifa_only
    password: 3GB^N&4NNI76UwhdlOcpYdS#
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
  import:
    company-filter: 德保

# 高德地图 API
amap:
  key: YOUR_AMAP_KEY_HERE

security:
  qr:
    # 收款码打包在 jar 的 secure/qr/ 下，启动时 ECDSA 验签；
    # 生产默认 true：校验失败拒绝启动，避免带病返回可疑收款码。
    fail-fast: ${QR_FAIL_FAST:true}
    # 每日巡检（绕过缓存重新验签），失败记 PAYMENT_QR_INTEGRITY_PATROL_FAILED
    patrol-cron: "${QR_PATROL_CRON:0 0 3 * * *}"

# 施工状态链（派工 → 待接收 → 已接收 → 已上门 → 客户已确认 → 施工中）
construct:
  # 用户告知书模板；留空使用服务端内置模板。
  # 变量：{workerName} {noticeTime} {orderNo} {community} {address} {products} {date}
  notice-template: ${CONSTRUCT_NOTICE_TEMPLATE:}
  notify:
    # 施工进度公众号通知；未配置 CONSTRUCT_PROGRESS 模板时静默跳过，不影响业务
    enabled: ${CONSTRUCT_NOTIFY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # SDK 引入 Redis starter 后，Redis 未配置凭据时不能拖垮 /actuator/health
    redis:
      enabled: false

logging:
  level:
    com.aip.ops: DEBUG
